# Ships @getsales/n8n-nodes-getsales to npm when a tag such as v1.0.0 is pushed.
#
# The work is split so that the dev tree never runs where a publishing token can be minted:
#   check    reads the repository only. It confirms the tag names the version in
#            package.json, installs the dev tooling with install scripts off, runs the lint
#            and the tests, packs the tarball and keeps it as a workflow artifact.
#   publish  receives that tarball and runs nothing from the project: no checkout, no
#            npm ci, no package script. It is the one job allowed to request a GitHub OIDC
#            token, which npm uses to attach the provenance statement n8n's verification
#            reads. Its environment, npm, is where a required reviewer can be added.
#
# npm credential: until the package exists on npmjs.com, npm can only take a token, kept as
# the secret NPM_TOKEN of the npm environment. npm takes no direct first publish from a token
# on an account with 2FA, so the first version is staged: npm stage publish sends it, with
# its provenance, to the account's Staged Packages, where a maintainer approves it with 2FA.
# Once the package exists, register this repository and this file as its trusted publisher
# on npmjs.com and drop the secret: later tags then publish directly. Staged publishing needs
# npm 11.15.0 or newer, so the publish job runs Node 24 and prints its npm version first.
name: Release to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: getsales-n8n-nodes-getsales-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm --version
      - name: Publish, or stage the first version
        run: |
          if npm view @getsales/n8n-nodes-getsales version >/dev/null 2>&1; then
            npm publish ./getsales-n8n-nodes-getsales-*.tgz --provenance --access public --ignore-scripts
          else
            npm stage publish ./getsales-n8n-nodes-getsales-*.tgz --provenance --access public --ignore-scripts
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
